name: Hourly gold signals
on:
  schedule:
    - cron: "4 * * * 0-5"   # 4 minutes past each hour, Sunday to Friday (UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: goldbot-state, cancel-in-progress: false }
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Check for signals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python -m goldbot.live
      - name: Save state
        run: |
          git config user.name "gold-bot"; git config user.email "gold-bot@users.noreply.github.com"
          git add state
          git commit -m "Signal state update" || exit 0
          git pull --rebase && git push
