name: Snapshot price data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: goldbot-state, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          from goldbot.data import fetch_hourly
          import os; os.makedirs("data", exist_ok=True)
          for sym, name in [("GC=F", "gold_1h"), ("SI=F", "silver_1h"), ("AUDUSD=X", "audusd_1h")]:
              df = fetch_hourly(sym); df.to_csv(f"data/{name}.csv"); print(name, len(df), df.index[0], df.index[-1])
          PY
      - name: Long OANDA history
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: python -m goldbot.oanda_history XAU_USD AUD_USD
      - run: |
          git config user.name "gold-bot"; git config user.email "gold-bot@users.noreply.github.com"
          git add data; git commit -m "Price data snapshot" || exit 0
          git pull --rebase && git push
